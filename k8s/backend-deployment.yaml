apiVersion: apps/v1
kind: Deployment
metadata:
  name: gds-backend
  namespace: gds
  labels:
    app: gds-backend
spec:
  replicas: 1
  # Com 1 replica e maxUnavailable 25% (=0 arredondado), o rollout ja sobe o novo
  # pod antes de derrubar o antigo. Explicitar evita depender do arredondamento
  # caso replicas mude.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gds-backend
  template:
    metadata:
      labels:
        app: gds-backend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: backend
        image: ghcr.io/proepi-dev/gds-admin/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: gds-backend-otel
        env:
        - name: OTEL_SERVICE_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: JWT_EXPIRES_IN
        - name: JWT_REFRESH_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: JWT_REFRESH_EXPIRES_IN
        # HMAC para pseudônimos estáveis no export BI (usuario_ref / participacao_ref)
        - name: BI_EXPORT_PSEUDONYM_SECRET
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: BI_EXPORT_PSEUDONYM_SECRET
        - name: MAILER_SMTP_ADDRESS
          valueFrom:
            secretKeyRef:
              name: mail-credentials
              key: MAILER_SMTP_ADDRESS
        - name: MAILER_EMAIL
          valueFrom:
            secretKeyRef:
              name: mail-credentials
              key: MAILER_EMAIL
        - name: MAILER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mail-credentials
              key: MAILER_PASSWORD
        - name: MAILER_SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: mail-credentials
              key: MAILER_SMTP_PORT
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: mail-credentials
              key: FRONTEND_URL
        resources:
          requests:
            # requests.cpu fica em 250m de proposito: o node ja tem 83% da CPU
            # reservada (3320m de 4000m) e, com maxSurge 1, subir para 500m
            # deixaria o pod novo Pending no meio do rollout. O que estrangulava
            # era o limit, nao o request.
            memory: "512Mi"
            cpu: "250m"
          limits:
            # 500m estrangulava o processo: 79% dos periodos do CFS eram
            # congelados em horario normal (medido em /sys/fs/cgroup). Como o
            # Node e single-thread, ele queima a quota nos primeiros ms de cada
            # janela de 100ms e fica parado o resto — a latencia estoura mesmo
            # com uso medio de CPU baixo. O node tem 4 cores e opera a ~33% no
            # pico, entao ha folga para 2 cores.
            memory: "1Gi"
            cpu: "2000m"
        # Sem probes o Traefik roteia para o pod antes do Nest terminar de subir
        # (502 em todo rollout) e um event loop travado nunca e reciclado.
        # /v1/health e @Public, esta no allowlist da manutencao e devolve 200
        # mesmo com o banco fora — serve para medir o processo, nao o banco.
        startupProbe:
          httpGet:
            path: /v1/health
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 3000
          periodSeconds: 20
          timeoutSeconds: 10
          # ~2min sem responder antes de reiniciar. Folgado de proposito: sob
          # throttling o /v1/health chegou a passar de 30s, e um liveness curto
          # transformaria lentidao em crash loop.
          failureThreshold: 6
