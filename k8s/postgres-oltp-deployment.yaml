apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-oltp
  namespace: gds
  labels:
    app: postgres-oltp
spec:
  replicas: 1
  # O PVC e local-path (hostPath) com RWO: num RollingUpdate o pod novo sobe no
  # mesmo node e monta o mesmo PGDATA que o antigo ainda segura. Recreate derruba
  # o antigo antes — custa alguns segundos de indisponibilidade, que so existem
  # porque trocar os -c exige reiniciar o Postgres de qualquer forma.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-oltp
  template:
    metadata:
      labels:
        app: postgres-oltp
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: DB_NAME
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gds-secrets
              key: DB_PASS
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # Tudo abaixo estava no default do Postgres: shared_buffers 128MB,
        # work_mem 4MB, effective_cache_size 4GB (mentira, o container so tinha
        # 512Mi). Resultado: 41 GB gravados em arquivos temporarios porque
        # ordenacoes e hashes nao cabiam em 4MB. Passar por -c sobrepoe o
        # postgresql.conf que mora dentro do PVC, sem precisar editar o volume.
        args:
        - -c
        - shared_buffers=768MB
        - -c
        - effective_cache_size=2GB
        - -c
        - work_mem=16MB
        - -c
        - maintenance_work_mem=256MB
        # Disco e SSD: o default 4.0 faz o planner preferir seq scan sem motivo.
        - -c
        - random_page_cost=1.1
        # shared_preload_libraries so pode ser trocado com restart do postmaster
        # (context=postmaster, nao aceita reload). Como esta mudanca ja reinicia
        # o Postgres de qualquer forma, a extensao pega carona sem custo extra.
        # Sem isso, CREATE EXTENSION ate funciona mas a view levanta erro.
        - -c
        - shared_preload_libraries=pg_stat_statements
        - -c
        - pg_stat_statements.max=5000
        - -c
        - pg_stat_statements.track=top
        # Sessao aberta pelo k9s/kubectl exec fica orfa quando a janela fecha: o
        # psql dentro do container sobrevive e segura o backend do Postgres.
        # Em 24/08 havia 22 assim, a mais antiga de 02/02 — 22% do
        # max_connections parado. 24h e folgado de proposito: vale para todas as
        # sessoes, inclusive as do pool do Prisma, que ficam ociosas entre
        # requisicoes e sao reutilizadas muito antes disso sob qualquer trafego.
        - -c
        - idle_session_timeout=24h
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            # Estava colado no teto: memory.current 531MB de 537MB (98,9%) e
            # memory.peak ja tinha ultrapassado o limite. CPU nao e o problema
            # aqui (0,13 core, 1,7% throttled), memoria e.
            memory: "3Gi"
            cpu: "1500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-oltp-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-oltp
  namespace: gds
  labels:
    app: postgres-oltp
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres-oltp

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-oltp-pvc
  namespace: gds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
