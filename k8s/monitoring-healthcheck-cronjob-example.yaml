# Monitoramento "guarda-chuva" do GDS — pega expiração silenciosa antes de virar incidente,
# e manda um heartbeat diário pro Discord dizendo que está tudo bem.
#
# Motivação (incidentes de 07/10/2026, todos "expiração silenciosa sem ninguém olhando"):
#   1. Cert TLS do bi.gds expirou (renovação ACME travada) — 43 dias despercebido.
#   2. Chaves Tailscale das 2 VPS expiraram (~180d) -> FDW VPS2->VPS1 caiu -> refresh BI em Error 14d.
#
# O que roda (namespace analytics, onde a tailnet é alcançável — mesmo caminho de rede do refresh):
#   - ConfigMap `gds-monitoring-config`  : tunables (hosts de cert, alvos de tailnet, dias de aviso).
#   - ConfigMap `gds-monitoring-script`  : o script de checagem (fonte única).
#   - CronJob   `gds-monitoring`         : a cada 6h. Alerta no Discord + Healthchecks /fail SÓ em falha.
#   - CronJob   `gds-monitoring-daily`   : 1x/dia 09:00. Posta o relatório no Discord SEMPRE (verde ou vermelho).
#
# Checagens: validade dos certs TLS (api/console/bi.gds) e reachability TCP da tailnet (FDW VPS2->VPS1).
# A reachability da tailnet é um INDICADOR ANTECEDENTE: acusa a tailnet caída antes do refresh de 4/4h falhar.
#
# Secrets (opcionais; sem eles roda e loga, só não notifica):
#   # Discord — webhook do canal (Config. do Servidor -> Integrações -> Webhooks -> Novo Webhook -> Copiar URL):
#   kubectl -n analytics create secret generic gds-monitoring-discord \
#     --from-literal=DISCORD_WEBHOOK_URL='https://discord.com/api/webhooks/<id>/<token>'
#   # Healthchecks.io (dead man's switch — cobre "o Job nem rodou"; crie um check dedicado, Period 6h):
#   kubectl -n analytics create secret generic gds-monitoring-healthcheck \
#     --from-literal=HEALTHCHECK_URL=https://hc-ping.com/<uuid>
#
# Aplicar:   kubectl apply -f k8s/monitoring-healthcheck-cronjob-example.yaml
# Testar já: kubectl -n analytics create job --from=cronjob/gds-monitoring-daily monitoring-daily-test
#            kubectl -n analytics logs job/monitoring-daily-test

apiVersion: v1
kind: ConfigMap
metadata:
  name: gds-monitoring-config
  namespace: analytics
data:
  CERT_HOSTS: "api.gds.proepi.org.br console.gds.proepi.org.br bi.gds.proepi.org.br"
  CERT_WARN_DAYS: "21"
  TAILNET_TARGETS: "100.117.3.100:5432"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gds-monitoring-script
  namespace: analytics
data:
  check.sh: |
    #!/bin/sh
    set -u
    apk add --no-cache openssl netcat-openbsd curl >/dev/null 2>&1
    HC="${HEALTHCHECK_URL:-}"
    DISCORD="${DISCORD_WEBHOOK_URL:-}"
    WARN="${CERT_WARN_DAYS:-21}"
    ALWAYS="${ALWAYS_REPORT:-false}"
    out=""
    line(){ out="${out}$(printf '\n%s' "$1")"; }
    hc(){ [ -z "$HC" ] && return 0; wget -qO- --timeout=15 "${HC}${1:-}" >/dev/null 2>&1 || true; }
    discord(){
      [ -z "$DISCORD" ] && return 0
      esc=$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g' | awk 'BEGIN{ORS="\\n"}{print}')
      curl -fsS -m 15 -H "Content-Type: application/json" -d "{\"content\":\"$esc\"}" "$DISCORD" >/dev/null 2>&1 || true
    }
    hc /start
    fail=0
    for host in $CERT_HOSTS; do
      if echo | openssl s_client -connect "${host}:443" -servername "$host" 2>/dev/null \
           | openssl x509 -checkend $((WARN*86400)) >/dev/null 2>&1; then
        line "OK [CERT] $host (>${WARN}d)"
      else
        end=$(echo | openssl s_client -connect "${host}:443" -servername "$host" 2>/dev/null \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
        fail=1
        line "FALHA [CERT] $host expira em menos de ${WARN}d (NotAfter: ${end:-sem resposta})"
      fi
    done
    for hp in $TAILNET_TARGETS; do
      h=${hp%:*}; p=${hp##*:}
      if nc -z -w5 "$h" "$p" >/dev/null 2>&1; then
        line "OK [NET] $hp"
      else
        fail=1
        line "FALHA [NET] $hp inalcancavel (Tailscale caiu / chave expirada?)"
      fi
    done
    printf '%s\n' "$out"
    if [ "$fail" -ne 0 ]; then
      discord "[GDS/VPS2] ALERTA de monitoramento:$out"
      hc /fail
      exit 1
    fi
    hc ""
    [ "$ALWAYS" = "true" ] && discord "[GDS/VPS2] Relatorio diario - esta tudo bem:$out"
    echo "TUDO OK"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gds-monitoring
  namespace: analytics
  labels:
    app: gds-monitoring
spec:
  schedule: "0 */6 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: gds-monitoring-script
          containers:
            - name: monitor
              image: alpine:3.20
              command: ["/bin/sh", "/scripts/check.sh"]
              envFrom:
                - configMapRef:
                    name: gds-monitoring-config
              env:
                - name: ALWAYS_REPORT
                  value: "false"
                - name: HEALTHCHECK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gds-monitoring-healthcheck
                      key: HEALTHCHECK_URL
                      optional: true
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gds-monitoring-discord
                      key: DISCORD_WEBHOOK_URL
                      optional: true
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "25m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gds-monitoring-daily
  namespace: analytics
  labels:
    app: gds-monitoring
spec:
  schedule: "0 9 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: script
              configMap:
                name: gds-monitoring-script
          containers:
            - name: monitor
              image: alpine:3.20
              command: ["/bin/sh", "/scripts/check.sh"]
              envFrom:
                - configMapRef:
                    name: gds-monitoring-config
              env:
                - name: ALWAYS_REPORT
                  value: "true"
                - name: HEALTHCHECK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gds-monitoring-healthcheck
                      key: HEALTHCHECK_URL
                      optional: true
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gds-monitoring-discord
                      key: DISCORD_WEBHOOK_URL
                      optional: true
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "25m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
